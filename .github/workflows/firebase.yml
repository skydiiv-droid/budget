# 커밋하면 Firebase에 배포한다.
#
# 이 저장소가 Firebase를 고치는 유일한 통로다. 콘솔에서 손으로 고치면
# 무엇을 왜 바꿨는지 남지 않으므로, 규칙과 함수와 화면을 전부 여기 둔다.
#
# 필요한 것: 저장소 Secrets 에 FIREBASE_SERVICE_ACCOUNT
#   (Firebase 콘솔 > 프로젝트 설정 > 서비스 계정 > 새 비공개 키 생성 한 JSON 전체)

name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - claude/iphone-budget-app-review-zmr3x5
    paths:
      - 'firebase/**'
      - '.github/workflows/firebase.yml'
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 순수 로직은 한 곳(shared/)에만 둔다. 함수도 화면도 그 복사본을 쓴다.
      # Firebase는 functions/ 밖의 파일을 올려 주지 않고, 브라우저는 상위
      # 폴더를 못 읽으므로 배포 직전에 양쪽으로 복사한다.
      - name: 공용 로직 복사
        run: |
          rm -rf firebase/functions/shared firebase/public/shared
          mkdir -p firebase/functions firebase/public
          cp -r firebase/shared firebase/functions/shared
          cp -r firebase/shared firebase/public/shared

      - name: 테스트
        run: node --test firebase/shared/*.test.js

      - name: 인증 정보 준비
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 시크릿이 없습니다."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # 권한이 모자랄 때 어느 계정에 역할을 줘야 하는지 헤매지 않도록,
      # 지금 쓰는 계정을 그대로 찍는다. 이메일과 프로젝트 이름은 비밀이 아니다.
      - name: 누구로 로그인했는지
        run: |
          node -e '
            const sa = require(process.env.GOOGLE_APPLICATION_CREDENTIALS);
            console.log("서비스 계정 :", sa.client_email);
            console.log("프로젝트    :", sa.project_id);
          '
          echo ""
          echo "이 계정에 역할을 줘야 합니다:"
          echo "https://console.cloud.google.com/iam-admin/iam?project=budget-13aec"

      # 이 계정이 프로젝트를 보기는 하는지. 목록에 budget-13aec 가 없으면
      # 권한이 아니라 키 자체가 다른 프로젝트의 것이다.
      - name: 프로젝트에 닿는지
        continue-on-error: true
        run: npx --yes firebase-tools@13 projects:list

      # lockfile 을 두지 않으므로 npm ci 가 아니라 install 을 쓴다.
      # 의존성이 둘뿐이고 Firebase 가 배포 때 다시 설치하므로 고정할 실익이 적다.
      - name: 함수 의존성 설치
        working-directory: firebase/functions
        run: npm install --omit=dev --no-audit --no-fund

      # 한 번에 올리면 어디서 막혔는지 안 보인다. 나눠서 올린다.
      # 권한이 모자라면 그 단계만 빨개지므로 무엇을 줘야 하는지 바로 안다.
      - name: 화면 올리기 (Hosting)
        working-directory: firebase
        run: npx --yes firebase-tools@13 deploy --only hosting --non-interactive

      # --debug 를 붙이면 구글이 돌려준 본문이 그대로 나온다.
      # "Permission 'firebaserules.releases.update' denied" 처럼
      # 어떤 권한이 없는지 이름이 찍힌다. 그게 없으면 계속 추측하게 된다.
      # 규칙은 거의 안 바뀌므로 여기서 막혀도 나머지를 멈추지 않는다.
      # 권한이 풀릴 때까지는 콘솔에 한 번 붙여넣어 두면 된다
      # (Firestore > 규칙 > firebase/firestore.rules 내용 붙여넣기 > 게시).
      - name: 보안 규칙 올리기 (Firestore)
        id: rules
        continue-on-error: true
        working-directory: firebase
        run: npx --yes firebase-tools@13 deploy --only firestore --non-interactive --debug

      - name: 규칙이 막혔으면 알려 주기
        if: steps.rules.outcome == 'failure'
        run: |
          {
            echo "### ⚠️ 보안 규칙은 못 올렸습니다"
            echo ""
            echo "권한이 풀릴 때까지는 콘솔에 한 번 붙여넣어 두세요."
            echo ""
            echo "1. https://console.firebase.google.com/project/budget-13aec/firestore/rules"
            echo "2. \`firebase/firestore.rules\` 내용을 붙여넣고 **게시**"
            echo ""
            echo "규칙은 거의 바뀌지 않으므로 한 번이면 됩니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 수집 함수 올리기 (Functions)
        working-directory: firebase
        run: npx --yes firebase-tools@13 deploy --only functions --non-interactive

      - name: 주소
        run: |
          {
            echo "### 배포 완료"
            echo ""
            echo "- 화면: https://budget-13aec.web.app"
            echo "- 수집: https://asia-northeast3-budget-13aec.cloudfunctions.net/ingest"
          } >> "$GITHUB_STEP_SUMMARY"
