<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F7FB">
<title>가계부</title>

<!-- 홈 화면에 얹으면 사파리 껍데기 없이 앱처럼 뜬다. 아이콘도 이때 쓰인다. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="boot" class="center">
  <div>
    <h1>가계부</h1>
    <p class="muted" style="margin-top:10px">불러오는 중…</p>
  </div>
</div>

<div id="app" hidden>
  <div class="wrap">
    <div class="row" style="margin-bottom:14px">
      <div class="grow"><h1>가계부</h1><div class="sub" id="monthLabel"></div></div>
      <button type="button" class="act ghost" id="peek" hidden
        style="min-height:38px;padding:8px 11px;font-size:15px" aria-label="금액 표시">👁</button>
      <button type="button" class="act ghost" id="refresh" style="min-height:38px;padding:8px 12px;font-size:12.5px">새로고침</button>
    </div>
    <section id="home"></section>
    <section id="history" hidden></section>
    <section id="inbox" hidden></section>
    <section id="fixed" hidden></section>
    <section id="setup" hidden></section>
  </div>

  <button type="button" class="fab" id="quickOpen" aria-label="직접 입력">＋</button>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-back" data-close></div>
    <form class="sheet-box" data-form="quick" novalidate>
      <div class="row" style="margin-bottom:14px">
        <span class="grow" style="font-size:16px;font-weight:600">직접 입력</span>
        <button type="button" class="act ghost small" data-close>닫기</button></div>

      <div class="seg" role="tablist">
        <button type="button" data-kind="expense" aria-current="page">지출</button>
        <button type="button" data-kind="income">수입</button>
        <button type="button" data-kind="transfer">이체</button>
      </div>
      <input type="hidden" name="type" value="expense">

      <div class="fields" style="margin-top:14px">
        <div class="field" style="flex:2"><label>금액</label>
          <input name="amount" inputmode="numeric" placeholder="12,000" required></div>
        <div class="field" style="flex:3"><label>날짜</label>
          <input name="date" type="date"></div></div>

      <div class="field"><label id="quickWhatLabel">지출처</label>
        <input name="merchantRaw" placeholder="가맹점 또는 내용"></div>

      <div class="field" data-qwhen="expense income"><label>카테고리</label>
        <select name="categoryId"></select></div>

      <div class="field" data-qwhen="expense transfer"><label id="quickFromLabel">출금 계좌 · 카드</label>
        <select name="accountId"></select></div>
      <div class="field" data-qwhen="income transfer">
        <label id="quickToLabel">입금 계좌</label>
        <select name="toAccountId"></select></div>

      <label class="check" data-qwhen="expense"><input type="checkbox" name="excludeFromBudget">
        <span>예산에서 제외 (더치페이 · 환불 등)</span></label>

      <button type="submit" class="act primary" style="width:100%">등록</button>
    </form>
  </div>

  <nav class="tabs" aria-label="화면">
    <button type="button" data-tab="home" aria-current="page">홈</button>
    <button type="button" data-tab="history">내역</button>
    <button type="button" data-tab="inbox">확인<span class="badge" id="badge" hidden>0</span></button>
    <button type="button" data-tab="fixed">고정지출</button>
    <button type="button" data-tab="setup">설정</button>
  </nav>
</div>

<script type="module" src="/app.js"></script>
<script>
  // 껍데기를 담아 둔다. 실패해도 앱은 그대로 돈다 — 담아 두는 건 덤이다.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
